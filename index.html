<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin CBMCE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚒</text></svg>" />
  <style>
    :root {
      --bg: #f5f3f1; --surface: #ffffff; --text: #1d1a18; --muted: #6b635d; --border: #e4ded8;
      --brand: #b3261e; --brand-strong: #8f1d17; --brand-soft: #fbe9e7;
      --ok: #1e7a46; --ok-soft: #e3f3ea; --off: #8a817a; --off-soft: #efebe7;
      --err: #a3231b; --err-soft: #fdecea;
      --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161312; --surface: #211d1b; --text: #f2ede9; --muted: #a89f98; --border: #362f2b;
        --brand: #c7372e; --brand-strong: #e0574c; --brand-soft: #3a1f1c;
        --ok: #5fc48a; --ok-soft: #1b3326; --off: #9a918a; --off-soft: #2b2522;
        --err: #f19a92; --err-soft: #3a1f1c; --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    }
    header { background: var(--brand); color: #fff; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; width: 100%; }
    .bar { display: flex; align-items: center; gap: 12px; padding: 18px 16px; }
    .logo { width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,.15);
      display: grid; place-items: center; font-size: 24px; flex-shrink: 0; }
    .bar h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
    .bar p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
    .user { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .user span { opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
    .ghost { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35);
      padding: 7px 12px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
    .ghost:hover { background: rgba(255,255,255,.25); }
    main { flex: 1; padding: 28px 0 40px; }
    .intro { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px;
      box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
    .card-top { display: flex; align-items: center; gap: 12px; }
    .icon { width: 42px; height: 42px; border-radius: 10px; background: var(--brand-soft);
      display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
    .card h2 { margin: 0; font-size: 17px; }
    .status { display: inline-block; margin-top: 3px; font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; }
    .status.on { color: var(--ok); background: var(--ok-soft); }
    .status.soon { color: var(--off); background: var(--off-soft); }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; flex: 1; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px;
      border-radius: 10px; font: inherit; font-size: 15px; font-weight: 600; text-decoration: none;
      background: var(--brand); color: #fff; border: 0; cursor: pointer; transition: background .15s; width: 100%; }
    .btn:hover { background: var(--brand-strong); }
    .btn:focus-visible, input:focus-visible, .ghost:focus-visible { outline: 3px solid var(--brand-strong); outline-offset: 2px; }
    .btn:disabled { opacity: .7; cursor: wait; }
    .toggle-row { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
    .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; font-weight: 600; flex-direction: row; }
    .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .slider { width: 40px; height: 22px; border-radius: 999px; background: var(--off-soft); border: 1px solid var(--border);
      position: relative; flex-shrink: 0; transition: background .15s; }
    .slider::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--off); transition: transform .15s, background .15s; }
    .switch input:checked + .slider { background: var(--ok); border-color: var(--ok); }
    .switch input:checked + .slider::after { transform: translateX(18px); background: #fff; }
    .switch input:focus-visible + .slider { outline: 3px solid var(--brand-strong); outline-offset: 2px; }
    .switch input:disabled + .slider { opacity: .5; }
    .toggle-msg { font-size: 12px; color: var(--muted); padding-left: 50px; }
    .link-label { font-size: 14px; }
    .link-label input { width: 100%; font-size: 14px; }
    .link-actions { display: flex; gap: 8px; }
    .btn-small { padding: 8px 12px; font-size: 14px; width: auto; }
    .link-row .toggle-msg { padding-left: 0; }
    .btn-alt { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
    .btn-alt:hover { background: var(--brand-soft); }
    .btn[aria-disabled="true"] { background: var(--off-soft); color: var(--off); pointer-events: none; }
    .login { max-width: 380px; margin: 24px auto 0; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
    .login h2 { margin: 0; font-size: 20px; }
    .login p { margin: 0; color: var(--muted); font-size: 14px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
    input { font: inherit; font-weight: 400; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); }
    .error { color: var(--err); background: var(--err-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .loading { text-align: center; color: var(--muted); padding: 40px 0; }
    footer { color: var(--muted); font-size: 12px; padding: 16px 0 24px; text-align: center; }
    @media (max-width: 520px) { .user span { display: none; } }
  </style>
  <!-- Estatísticas de uso anônimas (painel central CBMCE) -->
  <script defer src="https://cbmce-aluno-escala-atgb.vercel.app/rastro.js?s=portal"></script>
</head>
<body>
  <header>
    <div class="wrap bar">
      <div class="logo" aria-hidden="true">🚒</div>
      <div>
        <h1>ADMIN CBMCE</h1>
        <p>Painel central de administração</p>
      </div>
      <div class="user" id="userBox" hidden>
        <span id="userEmail"></span>
        <button class="ghost" id="logoutBtn" type="button">Sair</button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="loading" id="loadingView">Carregando…</div>

      <form class="login" id="loginView" hidden novalidate>
        <h2>Entrar</h2>
        <p>Use o mesmo e-mail e senha de administrador do Checklist.</p>
        <div class="error" id="loginError" role="alert" hidden></div>
        <label>E-mail
          <input type="email" name="email" autocomplete="username" required />
        </label>
        <label>Senha
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="btn" type="submit" id="loginBtn">Entrar</button>
      </form>

      <section id="hubView" hidden>
        <p class="intro">Escolha o sistema que deseja administrar.</p>
        <div class="grid" id="systems"></div>
      </section>
    </div>
  </main>

  <footer>Corpo de Bombeiros Militar do Ceará · ADMIN CBMCE</footer>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="pages.js"></script>
  <script>
    // Sistemas do portal. Para ativar um sistema, preencha "url".
    // O Checklist usa "/admin": o painel é servido neste mesmo endereço (ver vercel.json),
    // por isso o login feito aqui já vale lá.
    const SYSTEMS = [
      {
        name: "Página dos Usuários", icon: "👥",
        description: "Página pública (sem login) com os links para o efetivo: Checklist, Escala e outras páginas de usuário. Distribua este link.",
        url: "/usuarios", button: "Abrir página", copy: true
      },
      {
        name: "Checklist ABTS14", icon: "✅",
        description: "Blocos, itens, perguntas, vistorias recebidas, resumo, acessos e configurações do checklist.",
        url: "/admin", button: "Abrir admin do ABTS14", userPage: "checklist"
      },
      {
        name: "Checklist - Mata Branca", icon: "🌳",
        description: "VTR DIRSO Florestal (7ª CIA): blocos, itens, VTRs, perguntas, vistorias recebidas e resumo de alterações.",
        url: "/mata-branca-admin", button: "Abrir admin do Mata Branca", userPage: "mata-branca"
      },
      { name: "SisVTR", icon: "🚑", description: "Dashboard da frota: viaturas e máquinas por OBM, situação, tipo e marca. Edição e exclusão de cadastros.", url: "/sisvtr", button: "Abrir SisVTR" },
      { name: "SisDirso", icon: "📅", description: "Simulador e controle de plantões de DIRSO.", url: "", button: "Abrir SisDirso", userPage: "sisdirso" },
      {
        name: "Escala de Serviço", icon: "📋",
        description: "Consulta da escala por militar, função, data e permutas. O PDF exibido é o do link oficial abaixo.",
        url: "/escala/", button: "Abrir Escala", userPage: "escala",
        linkSetting: { label: "Link da escala (Google Drive)", hint: "Todos veem a escala deste link. Só muda quando você salvar outro." }
      }
    ];

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const cfg = window.ADMIN_CONFIG || {};
    let sbClient = null; // criado mais abaixo, depois do login

    function show(view) {
      for (const v of ["loadingView", "loginView", "hubView"]) $(v).hidden = v !== view;
    }
    function showError(msg) { $("loginError").textContent = msg; $("loginError").hidden = !msg; }

    // Destino pedido pelo Checklist (?redirect=/admin...), só caminhos deste site.
    function safeRedirect() {
      const r = new URLSearchParams(location.search).get("redirect");
      if (!r) return null;
      try {
        const u = new URL(r, location.origin);
        return u.origin === location.origin && u.pathname !== "/" ? u.pathname + u.search + u.hash : null;
      } catch { return null; }
    }

    document.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-copy]");
      if (!b) return;
      const link = b.dataset.copy;
      try { await navigator.clipboard.writeText(link); b.textContent = "Link copiado ✓"; }
      catch { window.prompt("Copie o link:", link); return; }
      setTimeout(() => { b.textContent = "Copiar link"; }, 2000);
    });

    // ---- Botões "Visível na página dos usuários" (tabela portal_pages no Supabase) ----
    const userPageIds = new Set((window.USER_PAGES || []).filter((p) => p.url).map((p) => p.id));

    function toggleHtml(s) {
      if (!s.userPage || !userPageIds.has(s.userPage)) return "";
      return `
        <div class="toggle-row">
          <label class="switch">
            <input type="checkbox" data-page="${esc(s.userPage)}" disabled />
            <span class="slider" aria-hidden="true"></span>
            <span class="switch-label">Visível na página dos usuários</span>
          </label>
          <span class="toggle-msg" data-msg="${esc(s.userPage)}">Carregando…</span>
        </div>`;
    }

    // ---- Link oficial (ex.: PDF da Escala), gravado em portal_pages.link ----
    const LINK_RE = /^https:\/\/(drive|docs)\.google\.com\//;

    function linkHtml(s) {
      if (!s.linkSetting || !s.userPage) return "";
      const id = esc(s.userPage);
      return `
        <div class="toggle-row link-row">
          <label class="link-label">${esc(s.linkSetting.label)}
            <input type="url" data-link="${id}" placeholder="https://drive.google.com/file/d/…" disabled />
          </label>
          <div class="link-actions">
            <button class="btn btn-alt btn-small" type="button" data-estat="salvar_link_escala" data-savelink="${id}" disabled>Salvar link</button>
            <a class="btn btn-alt btn-small" data-estat="ver_pdf_escala" data-openlink="${id}" target="_blank" rel="noopener" hidden>Ver PDF</a>
          </div>
          <span class="toggle-msg" data-linkmsg="${id}">${esc(s.linkSetting.hint)}</span>
        </div>`;
    }

    function setOpenLink(id, url) {
      const a = document.querySelector(`[data-openlink="${id}"]`);
      if (!a) return;
      a.hidden = !url;
      if (url) a.href = url;
    }

    async function loadLinks() {
      const inputs = document.querySelectorAll("[data-link]");
      if (!inputs.length) return;
      let rows = null;
      try {
        const r = await fetch(cfg.supabaseUrl + "/rest/v1/portal_pages?select=id,link", {
          headers: { apikey: cfg.supabasePublishableKey }, cache: "no-store"
        });
        if (r.ok) rows = await r.json();
      } catch { /* trata abaixo */ }
      for (const input of inputs) {
        const id = input.dataset.link;
        const msg = document.querySelector(`[data-linkmsg="${id}"]`);
        if (!rows) { msg.textContent = "Falta atualizar a tabela no Supabase (ver README)."; continue; }
        const row = rows.find((x) => x.id === id);
        input.value = row ? row.link || "" : "";
        input.dataset.saved = input.value;
        input.disabled = false;
        document.querySelector(`[data-savelink="${id}"]`).disabled = false;
        setOpenLink(id, input.value);
      }
    }

    document.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-savelink]");
      if (!b || !sbClient) return;
      const id = b.dataset.savelink;
      const input = document.querySelector(`[data-link="${id}"]`);
      const msg = document.querySelector(`[data-linkmsg="${id}"]`);
      const link = input.value.trim();
      if (link && !LINK_RE.test(link)) { msg.textContent = "Use um link do Google Drive (https://drive.google.com/…)."; return; }
      if (link === input.dataset.saved) { msg.textContent = "Nada mudou."; return; }
      if (!link && !confirm("Apagar o link? A escala ficará sem PDF para o efetivo.")) return;
      b.disabled = true; msg.textContent = "Salvando…";
      const { error } = await sbClient.from("portal_pages")
        .upsert({ id, link, updated_at: new Date().toISOString() });
      b.disabled = false;
      if (error) { msg.textContent = "Não salvou. Tente de novo."; return; }
      input.dataset.saved = link;
      setOpenLink(id, link);
      msg.textContent = link ? "Link salvo. O efetivo já vê esta escala." : "Link apagado.";
    });

    async function loadToggles() {
      const boxes = document.querySelectorAll("[data-page]");
      const res = await window.loadPageVisibility(cfg);
      for (const box of boxes) {
        const msg = document.querySelector(`[data-msg="${box.dataset.page}"]`);
        if (!res.ok) { msg.textContent = "Não foi possível carregar."; continue; }
        if (res.missing) { msg.textContent = "Falta criar a tabela no Supabase (ver README)."; continue; }
        box.checked = window.isPageVisible(window.USER_PAGES.find((p) => p.id === box.dataset.page), res.visible);
        box.disabled = false;
        msg.textContent = box.checked ? "Aparece para o efetivo" : "Oculta do efetivo";
      }
    }

    document.addEventListener("change", async (e) => {
      const box = e.target.closest("[data-page]");
      if (!box || !sbClient) return;
      const id = box.dataset.page, visible = box.checked;
      const msg = document.querySelector(`[data-msg="${id}"]`);
      box.disabled = true; msg.textContent = "Salvando…";
      const { error } = await sbClient.from("portal_pages")
        .upsert({ id, visible, updated_at: new Date().toISOString() });
      box.disabled = false;
      if (error) {
        box.checked = !visible;
        msg.textContent = "Não salvou. Tente de novo.";
      } else {
        msg.textContent = visible ? "Aparece para o efetivo" : "Oculta do efetivo";
      }
    });

    function renderHub(email) {
      $("userEmail").textContent = email;
      $("userBox").hidden = false;
      $("systems").innerHTML = SYSTEMS.map((s) => {
        const on = Boolean(s.url);
        return `
          <article class="card">
            <div class="card-top">
              <div class="icon" aria-hidden="true">${esc(s.icon)}</div>
              <div>
                <h2>${esc(s.name)}</h2>
                <span class="status ${on ? "on" : "soon"}">${on ? "Disponível" : "Em breve"}</span>
              </div>
            </div>
            <p>${esc(s.description)}</p>
            ${on ? `<a class="btn" href="${esc(s.url)}" data-estat="abrir_${esc(s.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_"))}">${esc(s.button)} →</a>`
                 : `<a class="btn" aria-disabled="true">Em breve</a>`}
            ${on && s.copy ? `<button class="btn btn-alt" type="button" data-estat="copiar_link" data-copy="${esc(new URL(s.url, location.origin).href)}">Copiar link</button>` : ""}
            ${toggleHtml(s)}
            ${linkHtml(s)}
          </article>`;
      }).join("");
      show("hubView");
      loadToggles();
      loadLinks();
    }

    if (!cfg.supabaseUrl || !cfg.supabasePublishableKey || !window.supabase) {
      show("loginView");
      showError("Configuração ausente: confira o arquivo config.js.");
      $("loginBtn").disabled = true;
    } else {
      const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey, {
        auth: { persistSession: true, autoRefreshToken: true }
      });
      sbClient = sb;

      // Nenhuma etapa pode deixar a tela travada: depois de 15 s vira erro.
      const withTimeout = (p, ms = 15000) => Promise.race([
        p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))
      ]);

      // Mesma regra do Checklist: quem decide se é admin é o banco (is_admin()).
      async function isAdmin() {
        const { data, error } = await withTimeout(sb.rpc("is_admin"));
        return !error && data === true;
      }

      async function enter(session) {
        const dest = safeRedirect();
        if (dest) { location.replace(dest); return; }
        renderHub(session.user.email || "");
      }

      (async () => {
        try {
          const { data } = await withTimeout(sb.auth.getSession());
          if (data.session && await isAdmin()) return enter(data.session);
          if (data.session) await sb.auth.signOut({ scope: "local" });
        } catch { /* sem sessão válida: mostra o login */ }
        show("loginView");
        if (new URLSearchParams(location.search).get("denied")) showError("Esta conta não tem permissão de administrador.");
      })();

      $("loginView").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.currentTarget; // guardado: depois de um await o evento perde a referência
        const f = new FormData(form);
        const email = String(f.get("email") || "").trim();
        const password = String(f.get("password") || "");
        if (!email || !password) return showError("Informe e-mail e senha.");
        showError("");
        $("loginBtn").disabled = true; $("loginBtn").textContent = "Entrando…";
        let data, error;
        try {
          ({ data, error } = await withTimeout(sb.auth.signInWithPassword({ email, password })));
        } catch {
          error = { message: "timeout" };
        }
        if (error && error.message === "timeout") {
          showError("O servidor demorou para responder. Verifique a internet e tente de novo.");
        } else if (error) {
          showError(/invalid login/i.test(error.message) ? "E-mail ou senha incorretos." : "Não foi possível entrar. Tente novamente.");
        } else if (!(await isAdmin().catch(() => false))) {
          await sb.auth.signOut({ scope: "local" });
          showError("Esta conta não tem permissão de administrador.");
        } else {
          form.reset();
          $("loginBtn").disabled = false; $("loginBtn").textContent = "Entrar";
          return enter(data.session);
        }
        $("loginBtn").disabled = false; $("loginBtn").textContent = "Entrar";
      });

      $("logoutBtn").addEventListener("click", async () => {
        await sb.auth.signOut({ scope: "local" });
        location.replace("/");
      });
    }
  </script>
</body>
</html>
